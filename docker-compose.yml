version: "3.9"

services:
  sensifyhr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensifyhr-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=""
      - SENSIFYHR_STT_MODEL=small
      - SENSIFYHR_OLLAMA_ENABLED=0
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - NUMEXPR_NUM_THREADS=8
      - OPENBLAS_NUM_THREADS=8
      - TORCH_NUM_THREADS=8
    volumes:
      - ./reports:/app/reports
      - ./weights:/app/weights
      - ./temp_uploads:/app/temp_uploads
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 14G
        reservations:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  reports:
    image: nginx:alpine
    container_name: sensifyhr-reports
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./reports:/usr/share/nginx/html:ro
      - ./nginx-reports.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sensifyhr
